<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Todo</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;

        background: linear-gradient(
            135deg,
            #eff6ff,
            #f8fafc
        );

        color: #1f2937;
    }

    .card {
        width: 90%;
        max-width: 500px;

        background: white;

        padding: 35px;

        border-radius: 16px;

        border: 1px solid #e5e7eb;

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.08);

        text-align: center;
    }

    .icon {
        font-size: 50px;
        margin-bottom: 15px;
    }

    h1 {
        margin: 0 0 10px;
        color: #111827;
        font-size: 26px;
    }

    .message {
        color: #6b7280;
        font-size: 15px;
        line-height: 1.6;
    }

    .todo-title {
        display: inline-block;

        margin: 15px 0;

        padding: 10px 15px;

        background-color: #fef2f2;

        color: #b91c1c;

        border-radius: 8px;

        font-weight: 700;
    }

    .warning {
        margin: 15px 0 25px;

        padding: 12px;

        background-color: #fff7ed;

        border: 1px solid #fed7aa;

        border-radius: 8px;

        color: #9a3412;

        font-size: 13px;
    }

    .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .button {
        padding: 11px 20px;

        border-radius: 8px;

        font-size: 14px;

        font-weight: 700;

        text-decoration: none;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    .cancel-button {
        background-color: #f3f4f6;

        color: #374151;

        border: 1px solid #e5e7eb;
    }

    .cancel-button:hover {
        background-color: #e5e7eb;
    }

    .delete-button {
        background-color: #dc2626;

        color: white;

        border: none;
    }

    .delete-button:hover {
        background-color: #b91c1c;

        transform: translateY(-1px);
    }

    @media (max-width: 500px) {

        .card {
            padding: 25px;
        }

        .actions {
            flex-direction: column;
        }

        .button {
            width: 100%;
        }

    }

</style>

</head>

<body>

<div class="card">

<div class="icon">
    ⚠️
</div>

<h1>Delete Todo?</h1>

<p class="message">
    Are you sure you want to delete this Todo?
</p>

<div class="todo-title">
    "{{ todo.title }}"
</div>

<div class="warning">
    ⚠️ This action cannot be undone.
</div>


<form method="POST">

    {% csrf_token %}

    <div class="actions">

        <a
            href="{% url 'edit_todos' %}"
            class="button cancel-button"
        >
            Cancel
        </a>

        <button
            type="submit"
            class="button delete-button"
        >
            🗑️ Yes, Delete
        </button>

    </div>

</form>

</div>

</body>

</html>
