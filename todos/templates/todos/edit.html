<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Todo</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eff6ff, #f8fafc);
        color: #1f2937;
    }

    /* Main container */

    .container {
        width: 92%;
        max-width: 650px;
        margin: 60px auto;
    }

    /* Header */

    .header {
        margin-bottom: 20px;
    }

    .header h1 {
        margin: 0;
        font-size: 32px;
        color: #111827;
    }

    .header p {
        margin: 7px 0 0;
        color: #6b7280;
        font-size: 14px;
    }

    /* Card */

    .card {
        background-color: white;
        padding: 32px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    /* Form */

    form p {
        margin: 0 0 20px;
    }

    form label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 700;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="number"],
    form input[type="datetime-local"],
    form textarea,
    form select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        background-color: #ffffff;
        color: #1f2937;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: all 0.2s ease;
    }

    form input[type="text"]:focus,
    form input[type="email"]:focus,
    form input[type="number"]:focus,
    form input[type="datetime-local"]:focus,
    form textarea:focus,
    form select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    form textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* Checkbox */

    form input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: #2563eb;
        cursor: pointer;
        vertical-align: middle;
    }

    /* Help text */

    form .helptext {
        display: block;
        margin-top: 6px;
        color: #9ca3af;
        font-size: 12px;
    }

    /* Error messages */

    .errorlist {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        color: #dc2626;
        font-size: 13px;
    }

    /* Buttons */

    .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #e5e7eb;
    }

    .save-button,
    .cancel-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 11px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .save-button {
        background-color: #2563eb;
        color: white;
        border: none;
        box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
    }

    .save-button:hover {
        background-color: #1d4ed8;
        transform: translateY(-1px);
    }

    .cancel-button {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #e5e7eb;
    }

    .cancel-button:hover {
        background-color: #e5e7eb;
        transform: translateY(-1px);
    }

    /* Todo information */

    .todo-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        padding: 14px 16px;
        background-color: #eff6ff;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        color: #1e40af;
        font-size: 13px;
    }

    .todo-info-icon {
        font-size: 20px;
    }

    /* Mobile */

    @media (max-width: 600px) {

        .container {
            width: 94%;
            margin: 30px auto;
        }

        .card {
            padding: 22px;
        }

        .header h1 {
            font-size: 27px;
        }

        .actions {
            flex-direction: column;
        }

        .save-button,
        .cancel-button {
            width: 100%;
        }
    }
</style>

</head>

<body>

<div class="container">

<!-- Header -->

<div class="header">

    <h1>✏️ Edit Todo</h1>

    <p>
        Update your task details and save your changes.
    </p>

</div>


<!-- Edit Card -->

<div class="card">

    <div class="todo-info">

        <span class="todo-info-icon">
            📝
        </span>

        <span>
            You are editing this Todo. Make your changes below.
        </span>

    </div>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="actions">

            <button type="submit" class="save-button">
                💾 Save Changes
            </button>

            <a href="{% url 'edit_todos' %}" class="cancel-button">
                ← Cancel
            </a>

        </div>

    </form>

</div>

</div>

</body>

</html>
