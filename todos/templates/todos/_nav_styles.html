<style>
html,
body {
    margin: 0;
    min-height: 100vh;
}

body {
    background: #f6f1e8;
    color: #1c1917;
}

.site-nav {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.92);
    border-bottom: 1px solid #e7e5e4;
    backdrop-filter: blur(10px);
}

.site-nav-inner,
.container,
.wrap,
.page {
    width: 94%;
    max-width: 1120px;
    margin-left: auto;
    margin-right: auto;
}

.site-nav-inner {
    padding: 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.site-brand {
    flex-shrink: 0;
    color: #0f766e;
    text-decoration: none;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.site-brand:hover {
    color: #115e59;
}

.nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
}

.nav form { margin: 0; }

.nav .button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    background: #fff;
    color: #44403c;
    text-decoration: none;
    border: 1px solid #d6d3d1;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: "Segoe UI", Tahoma, sans-serif;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.nav .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(28, 25, 23, 0.1);
}

.nav .button.home:hover {
    background: #ecfdf5;
    color: #0f766e;
    border-color: #5eead4;
}

.nav .button.about:hover {
    background: #fff7ed;
    color: #c2410c;
    border-color: #fdba74;
}

.nav .button.blog:hover {
    background: #f5f3ff;
    color: #6d28d9;
    border-color: #c4b5fd;
}

.nav .button.calendar:hover {
    background: #ecfdf5;
    color: #0f766e;
    border-color: #5eead4;
}

.nav .button.search:hover {
    background: #fffbeb;
    color: #b45309;
    border-color: #fcd34d;
}

.nav .button.edit:hover {
    background: #f8eaff;
    color: #651f83;
    border-color: #bf59eb;
}

.nav .button.profile:hover,
.nav .button.login:hover {
    background: #eff6ff;
    color: #1d4ed8;
    border-color: #93c5fd;
}

.nav .button.signup:hover {
    background: #0f766e;
    color: #fff;
    border-color: #0f766e;
}

.nav .button.logout {
    background: #fef2f2;
    color: #b91c1c;
    border-color: #fecaca;
}

.nav .button.logout:hover {
    background: #b91c1c;
    color: #fff;
    border-color: #b91c1c;
}

.nav .button.active {
    background: #0f766e;
    color: #fff;
    border-color: #0f766e;
}

.page-header {
    margin-bottom: 20px;
}

.page-banner {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 20px;
    align-items: center;
    margin-bottom: 22px;
    padding: 22px 24px;
    border-radius: 24px;
    border: 1px solid #e7e5e4;
    background:
        radial-gradient(circle at 12% 20%, rgba(94, 234, 212, 0.35), transparent 42%),
        radial-gradient(circle at 88% 10%, rgba(251, 191, 36, 0.22), transparent 36%),
        linear-gradient(135deg, #ffffff 0%, #f0fdfa 55%, #fff7ed 100%);
    box-shadow: 0 18px 40px rgba(28, 25, 23, 0.06);
}

.page-banner-art {
    position: relative;
    width: 88px;
    height: 88px;
    flex-shrink: 0;
}

.page-banner .orb {
    position: absolute;
    border-radius: 50%;
    display: block;
}

.page-banner .orb-a {
    inset: 0;
    background: linear-gradient(145deg, #5eead4, #0f766e);
    animation: banner-float 5s ease-in-out infinite;
}

.page-banner .orb-b {
    width: 28px;
    height: 28px;
    right: -6px;
    top: 4px;
    background: #fbbf24;
    animation: banner-float 4.2s ease-in-out infinite reverse;
}

.page-banner .orb-c {
    width: 16px;
    height: 16px;
    left: -4px;
    bottom: 8px;
    background: #fdba74;
    animation: banner-pulse 3.4s ease-in-out infinite;
}

.page-banner .mark {
    position: absolute;
    inset: 14px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    color: #0f766e;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.12);
}

.page-banner-body h1 {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: clamp(1.6rem, 2.4vw, 2.15rem);
    letter-spacing: -0.04em;
    line-height: 1.15;
    color: #1c1917;
}

.page-banner-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}

.banner-chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 11px;
    border-radius: 999px;
    background: #0f766e;
    color: #ecfdf5;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 12px;
    font-weight: 800;
}

.banner-chip.soft {
    background: #fff;
    color: #44403c;
    border: 1px solid #d6d3d1;
}

.page-banner-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

.banner-action {
    display: inline-flex;
    align-items: center;
    padding: 9px 14px;
    border-radius: 999px;
    text-decoration: none;
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 13px;
    font-weight: 800;
    background: #1c1917;
    color: #fafaf9;
    transition: transform 0.2s ease, background 0.2s ease;
}

.banner-action:hover {
    transform: translateY(-2px);
    background: #0f766e;
}

.page-banner--about {
    background:
        radial-gradient(circle at 18% 18%, rgba(251, 146, 60, 0.28), transparent 40%),
        linear-gradient(135deg, #fff7ed, #ffffff 60%, #ecfdf5);
}
.page-banner--about .orb-a { background: linear-gradient(145deg, #fdba74, #c2410c); }
.page-banner--about .mark { color: #c2410c; }

.page-banner--calendar {
    background:
        radial-gradient(circle at 80% 20%, rgba(45, 212, 191, 0.3), transparent 38%),
        linear-gradient(135deg, #ecfdf5, #ffffff 55%, #f0fdfa);
}
.page-banner--search {
    background:
        radial-gradient(circle at 15% 80%, rgba(252, 211, 77, 0.35), transparent 40%),
        linear-gradient(135deg, #fffbeb, #ffffff 58%, #fef3c7);
}
.page-banner--search .orb-a { background: linear-gradient(145deg, #fcd34d, #b45309); }
.page-banner--search .mark { color: #b45309; }

.page-banner--edit {
    background:
        radial-gradient(circle at 85% 30%, rgba(196, 181, 253, 0.4), transparent 40%),
        linear-gradient(135deg, #f5f3ff, #ffffff 55%, #faf5ff);
}
.page-banner--edit .orb-a { background: linear-gradient(145deg, #c4b5fd, #6d28d9); }
.page-banner--edit .mark { color: #6d28d9; }

.page-banner--profile {
    background:
        radial-gradient(circle at 20% 20%, rgba(147, 197, 253, 0.4), transparent 40%),
        linear-gradient(135deg, #eff6ff, #ffffff 55%, #f8fafc);
}
.page-banner--profile .orb-a { background: linear-gradient(145deg, #93c5fd, #1d4ed8); }
.page-banner--profile .mark { color: #1d4ed8; }

.page-banner--blog {
    background:
        radial-gradient(circle at 75% 25%, rgba(253, 186, 116, 0.35), transparent 40%),
        linear-gradient(135deg, #fff7ed, #ffffff 50%, #fef3c7);
}
.page-banner--blog .orb-a { background: linear-gradient(145deg, #fdba74, #b45309); }
.page-banner--blog .mark { color: #b45309; }

.page-banner--login,
.page-banner--signup {
    background:
        radial-gradient(circle at 12% 30%, rgba(94, 234, 212, 0.32), transparent 42%),
        linear-gradient(135deg, #ffffff, #f0fdfa);
}

@keyframes banner-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

@keyframes banner-pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.15); opacity: 1; }
}

@media (max-width: 860px) {
    .site-nav-inner {
        flex-direction: column;
        align-items: flex-start;
    }

    .nav {
        justify-content: flex-start;
    }

    .page-banner {
        grid-template-columns: 1fr;
        padding: 18px;
    }

    .page-banner-art {
        width: 72px;
        height: 72px;
    }

    .page-banner .mark {
        font-size: 22px;
        inset: 12px;
    }
}
</style>
