<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Todo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        .container {
            width: 92%;
            max-width: 750px;
            margin: 55px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #111827;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            color: #6b7280;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            background-color: white;
            color: #374151;
            text-decoration: none;
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .button:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
            transform: translateY(-1px);
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 18px 22px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #f97316);
            color: white;
        }

        .card-header h2 {
            margin: 0;
            font-size: 18px;
        }

        form {
            padding: 22px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .actions {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .save {
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.25);
        }

        .help {
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>➕ Add Todo</h1>
                <p>
                    Start from: <strong>{{ selected_date|date:"F j, Y" }}</strong>
                </p>
            </div>

            <a href="{% url 'calendar' %}?year={{ selected_date.year }}&month={{ selected_date.month }}"
                class="button">
                ← Back to Calendar
            </a>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Schedule this todo</h2>
            </div>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="actions">
                    <button type="submit" class="save">💾 Save</button>
                </div>

                <div class="help">
                    Tip: set an end date later than the start date for a duration.
                </div>
            </form>
        </div>
    </div>
</body>

</html>
