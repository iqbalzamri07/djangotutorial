<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f6f1e8;
            color: #1c1917;
        }
        .wrap {
            width: 92%;
            max-width: 500px;
            margin: 60px auto;
        }
        h1 { margin: 0 0 8px; font-size: 32px; }
        p { color: #57534e; }
        .card {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(28, 25, 23, 0.08);
        }
        label { display: block; margin: 0 0 6px; font-weight: 800; font-size: 13px; }
        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 14px;
        }
        .helptext { display: block; color: #78716c; font-size: 12px; margin: -8px 0 12px; }
        button {
            width: 100%;
            border: none;
            background: #0f766e;
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }
        .errorlist { color: #b91c1c; padding-left: 18px; font-size: 13px; }
        .alt { margin-top: 16px; text-align: center; }
        .alt a { color: #0f766e; font-weight: 800; text-decoration: none; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Create an account</h1>
    <p>Sign up to keep your todos private to you.</p>
    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
        <div class="alt">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>
</div>
</body>
</html>
