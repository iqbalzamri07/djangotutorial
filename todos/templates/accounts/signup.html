<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    {% include "todos/_nav_styles.html" %}
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .page {
            width: 94%;
            max-width: 1080px;
            margin: 36px auto 70px;
        }
        .kicker {
            margin: 0 0 6px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #0f766e;
        }
        .header h1 { margin: 0; font-size: 32px; }
        .header p { margin: 6px 0 0; color: #57534e; }
        .wrap {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 16px 40px rgba(28, 25, 23, 0.08);
        }
        label { display: block; margin: 0 0 6px; font-weight: 800; font-size: 13px; }
        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 14px;
        }
        .password-wrap {
            position: relative;
            margin-bottom: 14px;
        }
        .password-wrap input {
            margin-bottom: 0;
            padding-right: 46px;
        }
        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            border: none;
            background: transparent;
            color: #44403c;
            padding: 4px 6px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        .helptext { display: block; color: #78716c; font-size: 12px; margin: -8px 0 12px; }
        .card button[type="submit"] {
            width: 100%;
            border: none;
            background: #0f766e;
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }
        .errorlist { color: #b91c1c; padding-left: 18px; font-size: 13px; }
        .alt { margin-top: 16px; text-align: center; }
        .alt a { color: #0f766e; font-weight: 800; text-decoration: none; }
    </style>
</head>
<body>
<div class="page">
    <div class="header">
        <div>
            <p class="kicker">Account</p>
            <h1>Create an account</h1>
            <p>Sign up to keep your todos private to you.</p>
        </div>
        {% include "todos/_nav.html" with active_nav="signup" %}
    </div>
    <div class="wrap">
    <div class="card">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
        <div class="alt">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>
    </div>
</div>
<script>
    document.querySelectorAll('input[type="password"]').forEach((input) => {
        const wrap = document.createElement('div');
        wrap.className = 'password-wrap';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'eye-btn';
        btn.setAttribute('aria-label', 'Show password');
        btn.textContent = '👁️';
        btn.addEventListener('click', () => {
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? '👁️' : '🙈';
            btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });
        wrap.appendChild(btn);
    });
</script>
</body>
</html>
